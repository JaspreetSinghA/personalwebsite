<text x="422.4" y="134" fill="#71717a" font-size="11">0.38</text>
<text x="136" y="172" fill="#71717a" text-anchor="end">Neutrality</text>
<line x1="293.6" x2="362.0" y1="168" y2="168" stroke="#a1a1aa" stroke-opacity="0.6" stroke-width="2"/>
<circle cx="293.6" cy="168" r="6" fill="none" stroke="#eb6834" stroke-width="2.5"/>
<circle cx="362.0" cy="168" r="6" fill="#2a78d6"/>
<text x="282.6" y="172" fill="#71717a" text-anchor="end" font-size="11">0.07</text>
<text x="373.0" y="172" fill="#71717a" font-size="11">0.25</text>
<text x="136" y="210" fill="#71717a" text-anchor="end">Representation</text>
<line x1="206.2" x2="297.4" y1="206" y2="206" stroke="#a1a1aa" stroke-opacity="0.6" stroke-width="2"/>
