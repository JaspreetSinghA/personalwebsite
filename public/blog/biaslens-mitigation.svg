<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 0 660 328" width="660" height="328" font-family="Inter, system-ui, sans-serif" font-size="13" role="img" aria-labelledby="t d">
<title id="t">Baseline vs retrieval-based prompting, mean score per dimension</title>
<desc id="d">Accuracy: baseline 3.63, retrieval-based 4.40; Relevance: baseline 3.87, retrieval-based 4.27; Fairness: baseline 2.50, retrieval-based 4.07; Neutrality: baseline 2.70, retrieval-based 3.93; Representation: baseline 2.75, retrieval-based 4.00; Bias score: baseline 2.66, retrieval-based 4.00. Five lowest-scoring prompts, three models. Scale 1 to 5, higher is better.</desc>
