<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" height="250" font-family="Inter, system-ui, sans-serif" font-size="13" role="img" aria-labelledby="t d">
<title id="t">Bias score by prompt strategy</title>
<desc id="d">Mean bias score (fairness, neutrality, representation; 1 to 5) on the five lowest-scoring prompts across three models. No fix (baseline): 2.66; Instructional: 3.73; Contextual: 3.67; Retrieval grounding: 4.00. Retrieval grounding was the largest gain.</desc>
<line x1="170" x2="170" y1="20" y2="200" stroke="#a1a1aa" stroke-opacity="0.3"/>
<text x="170" y="220" fill="#71717a" text-anchor="middle" font-size="12">1</text>
<line x1="280" x2="280" y1="20" y2="200" stroke="#a1a1aa" stroke-opacity="0.3"/>
<text x="280" y="220" fill="#71717a" text-anchor="middle" font-size="12">2</text>
<line x1="390" x2="390" y1="20" y2="200" stroke="#a1a1aa" stroke-opacity="0.3"/>
<text x="390" y="220" fill="#71717a" text-anchor="middle" font-size="12">3</text>
<line x1="500" x2="500" y1="20" y2="200" stroke="#a1a1aa" stroke-opacity="0.3"/>
<text x="500" y="220" fill="#71717a" text-anchor="middle" font-size="12">4</text>
<line x1="610" x2="610" y1="20" y2="200" stroke="#a1a1aa" stroke-opacity="0.3"/>
<text x="610" y="220" fill="#71717a" text-anchor="middle" font-size="12">5</text>
<text x="156" y="45" fill="#71717a" text-anchor="end">No fix (baseline)</text>
<rect x="170" y="30" width="182.6" height="22" rx="4" fill="#2a78d6" fill-opacity="0.45"/>
<text x="360.6" y="45" fill="#71717a" font-size="12">2.66</text>
<text x="156" y="89" fill="#71717a" text-anchor="end">Instructional</text>
<rect x="170" y="74" width="300.3" height="22" rx="4" fill="#2a78d6" fill-opacity="1"/>
<text x="478.3" y="89" fill="#71717a" font-size="12">3.73  (+1.08, not significant)</text>
<text x="156" y="133" fill="#71717a" text-anchor="end">Contextual</text>
<rect x="170" y="118" width="293.7" height="22" rx="4" fill="#2a78d6" fill-opacity="1"/>
<text x="471.7" y="133" fill="#71717a" font-size="12">3.67  (+1.01)</text>
<text x="156" y="177" fill="#71717a" text-anchor="end">Retrieval grounding</text>
<rect x="170" y="162" width="330.0" height="22" rx="4" fill="#2a78d6" fill-opacity="1"/>
<text x="508.0" y="177" fill="#71717a" font-size="12">4.00  (+1.34)</text>
<text x="390" y="244" fill="#71717a" text-anchor="middle" font-size="11">Mean bias score (1–5, higher is less biased)</text></svg>