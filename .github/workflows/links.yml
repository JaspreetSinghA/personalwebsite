name: Check links

on:
  pull_request:
  schedule:
    - cron: "41 15 * * 1" # Mondays 15:41 UTC; catches external links that rot between PRs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      # args are eval'd by the action, so regexes must be quoted.
      # LinkedIn blocks bots (HTTP 999); the site's own absolute URLs (canonical/og) are covered by --root-dir.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --root-dir '${{ github.workspace }}/dist'
            --max-retries 3
            --accept '200..=299,429'
            --exclude '^https://(www\.)?linkedin\.com'
            --exclude '^https://www\.jaspreetahluwalia\.com'
            --exclude '^https://fonts\.(googleapis|gstatic)\.com'
            --exclude '^https://gc\.zgo\.at'
            dist
          fail: true
          jobSummary: true
          format: markdown
